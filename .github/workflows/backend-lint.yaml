name: Lint for Backend

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  black-lint:
    name: Run Black linter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Black
        run: |
          python -m pip install --upgrade pip
          pip install black

      - name: Run Black check
        run: |
          black --check backend
